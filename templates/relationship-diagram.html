<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关系图谱 - SQLearn</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/sqlearn_no_bg.ico') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/sqlearn_no_bg.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <div class="nav-container">
            <div class="logo" id="logo">SQLearn</div>
            <div class="nav-links">
                <a href="/" class="nav-link">首页</a>
                <a href="/text" class="nav-link">查询试验</a>
                <a href="/visual-sql" class="nav-link">图形化编写</a>
                <a href="/relationship-diagram" class="nav-link active">关系图谱</a>
            </div>
        </div>
    </div>
    
    <div class="main-container">
        <!-- 侧边栏切换按钮 -->
        <button class="sidebar-toggle-btn" id="toggleSidebar">
            <span class="toggle-icon">◀</span>
        </button>
        
        <!-- 左侧数据库结构面板 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>数据库结构</h3>
                <div class="database-switch">
                    <button class="db-switch-btn active" data-db="study">Study</button>
                    <button class="db-switch-btn" data-db="teach">Teach</button>
                </div>
            </div>
            
            <div class="database-structure" id="databaseStructure">
                <!-- 数据库结构将通过JavaScript动态加载 -->
            </div>
        </div>
        
        <!-- 主内容区域 -->
        <div class="main-content">
            <div class="page-header">
                <h1>🔍 关系图谱</h1>
                <p>直观展示数据库中的关系结构，帮助你理解数据之间的关系</p>
                <div class="warning-banner">
                    <span class="warning-icon">💡</span>
                    <span>点击节点查看详细信息，拖拽节点调整布局，滚轮缩放视图</span>
                </div>
            </div>
            
            <div class="workspace">
                <div class="diagram-container">
                    <div class="diagram-header">
                        <h3>数据库关系图</h3>
                        <div class="diagram-controls">
                            <button class="action-btn" id="resetView">重置视图</button>
                            <button class="action-btn" id="exportDiagram">导出图片</button>
                        </div>
                    </div>
                    
                    <div class="diagram-canvas" id="diagramCanvas">
                        <!-- 关系图将在这里渲染 -->
                        <div class="diagram-placeholder">
                            <div class="placeholder-icon">📊</div>
                            <p>关系图正在加载中...</p>
                        </div>
                    </div>
                </div>
                
                <div class="diagram-info">
                    <div class="info-panel">
                        <h4>关系说明</h4>
                        <div class="relationship-list" id="relationshipList">
                            <!-- 关系说明将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/relationship-diagram.js') }}"></script>
    <script>
        // 页面特定的JavaScript代码
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化关系图谱功能
            initRelationshipDiagram();
        });
    </script>
</body>
</html>
